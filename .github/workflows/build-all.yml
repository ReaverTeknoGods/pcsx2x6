# Android-only build and rolling updater release for the dedicated ARMSX2-based
# TeknoParrot companion branch. Desktop and iOS builds remain independent on
# their own branches and workflows.
name: Build Android

on:
  push:
    branches:
      - codex/android-port
    paths-ignore:
      - '**/*.md'
      - 'LICENSE*'
      - '.gitignore'
  pull_request:
    branches:
      - codex/android-port
    paths-ignore:
      - '**/*.md'
      - 'LICENSE*'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
    defaults:
      run:
        working-directory: platforms/android
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Confirm event source
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$GITHUB_SHA"
          echo "Building source $ACTUAL_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          # Keep this on GitHub's open-source cache implementation and allow
          # the dedicated long-lived Android branch to populate its own cache.
          # Pull requests restore caches but never write them.
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          # This fork carries a custom wrapper JAR that is not in Gradle's
          # published checksum allowlist. It remains pinned and tracked here.
          validate-wrappers: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore Android native compiler cache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: android-ccache-v1-${{ runner.os }}-arm64-ndk28.2-${{ hashFiles('platforms/android/app/build.gradle.kts', '**/CMakeLists.txt', '**/*.cmake') }}-${{ github.sha }}
          restore-keys: |
            android-ccache-v1-${{ runner.os }}-arm64-ndk28.2-${{ hashFiles('platforms/android/app/build.gradle.kts', '**/CMakeLists.txt', '**/*.cmake') }}-
            android-ccache-v1-${{ runner.os }}-arm64-ndk28.2-

      - name: Configure Android native compiler cache
        id: configure_ccache
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ccache
          fi
          ccache --set-config=max_size=4G
          ccache --zero-stats
          ccache --version

      # NDK matches the version AGP resolves to (build.gradle.kts pins none, so it
      # uses AGP's default 28.2.13676358); cmake 3.31.6 matches the pin in
      # build.gradle.kts. 3.22.1 (AGP's default) is the shaderc deps' exact
      # cmake_minimum_required floor and fails to configure spirv-tools.
      - name: Install NDK + CMake
        run: yes | sdkmanager "ndk;28.2.13676358" "cmake;3.31.6" >/dev/null || true

      # shaderc's SPIRV-Tools/glslang/etc. are fetched on demand (not vendored,
      # not submodules), so `submodules: recursive` above does not provide them.
      - name: Fetch shaderc third-party deps
        run: python3 app/src/main/cpp/3rdparty/shaderc/utils/git-sync-deps

      # librashader is built by cargo for the Android target; the runner's
      # rustup only ships the host std, so the cargo step dies with
      # "error[E0463]: can't find crate for `core`" without this.
      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android

      # Only pushes to the dedicated ARMSX2-based Android release branch may
      # use the production key. The PCSX2X6 master branch remains independent,
      # and PR/other-branch artifacts stay debug-signed test builds.
      - name: Configure TeknoParrot production signing
        if: >-
          github.event_name == 'push' &&
          github.repository == 'ReaverTeknoGods/pcsx2x6' &&
          github.ref == 'refs/heads/codex/android-port'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/teknoparrot-release.keystore"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/teknoparrot-release.keystore" \
            "$STORE_PASSWORD" \
            "$KEY_ALIAS" \
            "$KEY_PASSWORD" \
            > armsx2_keystore.properties

      - name: Generate Android build version
        id: android_version
        run: |
          # Both Android and TPUI compare this monotonic timestamp-derived
          # version. Keep versionName in TPUI's numeric A.B.C.build format.
          VERSION_CODE="$(( $(date -u +%s) - 1700000000 ))"
          BASE_VERSION="$(sed -n 's/.*versionName.*?:[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          printf '%s\n' "$BASE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          VERSION_NAME="${BASE_VERSION}.${VERSION_CODE}"
          test "$VERSION_CODE" -gt 1000000
          test "$VERSION_CODE" -le 2147483647
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Android versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      - name: Build latest-source GitHub APK
        env:
          ANDROID_VERSION_CODE: ${{ steps.android_version.outputs.code }}
          ANDROID_VERSION_NAME: ${{ steps.android_version.outputs.name }}
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          ./gradlew :app:assembleGithubRelease --stacktrace \
            -Parmsx2.versionCode="$ANDROID_VERSION_CODE" \
            -Parmsx2.versionName="$ANDROID_VERSION_NAME"

      - name: Report Android native compiler cache
        if: always() && steps.configure_ccache.outcome == 'success'
        run: ccache --show-stats

      - name: Verify generated APK metadata
        env:
          ANDROID_VERSION_CODE: ${{ steps.android_version.outputs.code }}
          ANDROID_VERSION_NAME: ${{ steps.android_version.outputs.name }}
        run: |
          python3 - <<'PY'
          import glob
          import json
          import os
          from pathlib import Path

          paths = glob.glob("app/build/outputs/apk/github/release/output-metadata.json")
          if len(paths) != 1:
              raise SystemExit(f"expected one output-metadata.json, found {paths}")

          metadata_path = Path(paths[0]).resolve()
          with metadata_path.open(encoding="utf-8") as stream:
              metadata = json.load(stream)
          if metadata.get("applicationId") != "com.armsx2":
              raise SystemExit(
                  f"applicationId mismatch: {metadata.get('applicationId')} != com.armsx2"
              )
          if metadata.get("variantName") != "githubRelease":
              raise SystemExit(
                  f"variant mismatch: {metadata.get('variantName')} != githubRelease"
              )
          elements = metadata.get("elements", [])
          if len(elements) != 1:
              raise SystemExit(f"expected one GitHub APK element, found {len(elements)}")

          element = elements[0]
          expected_code = int(os.environ["ANDROID_VERSION_CODE"])
          expected_name = os.environ["ANDROID_VERSION_NAME"]
          if element.get("versionCode") != expected_code:
              raise SystemExit(
                  f"versionCode mismatch: {element.get('versionCode')} != {expected_code}"
              )
          if element.get("versionName") != expected_name:
              raise SystemExit(
                  f"versionName mismatch: {element.get('versionName')} != {expected_name}"
              )
          output_file = element.get("outputFile", "")
          if not output_file or Path(output_file).name != output_file:
              raise SystemExit(f"unsafe or missing outputFile: {output_file!r}")
          output_path = metadata_path.parent / output_file
          if not output_path.is_file():
              raise SystemExit(f"metadata APK does not exist: {output_path}")
          apk_files = sorted(metadata_path.parent.glob("*.apk"))
          if apk_files != [output_path]:
              raise SystemExit(
                  f"expected metadata to identify the only APK, found {apk_files}"
              )
          print(
              "verified applicationId=com.armsx2 "
              f"variant=githubRelease versionName={expected_name} "
              f"versionCode={expected_code} outputFile={output_file}"
          )
          PY

      - name: Stage updater APK
        id: package_apk
        env:
          ANDROID_VERSION_NAME: ${{ steps.android_version.outputs.name }}
        run: |
          mapfile -t APK_FILES < <(find app/build/outputs/apk/github/release -maxdepth 1 -type f -name '*.apk')
          test "${#APK_FILES[@]}" -eq 1
          OUTPUT_DIR="$GITHUB_WORKSPACE/out/pcsx2x6-android"
          APK_PATH="$OUTPUT_DIR/pcsx2x6-${ANDROID_VERSION_NAME}-android-arm64.apk"
          mkdir -p "$OUTPUT_DIR"
          cp "${APK_FILES[0]}" "$APK_PATH"
          APK_NAME="$(basename "$APK_PATH")"
          APK_SIZE="$(stat -c '%s' "$APK_PATH")"
          APK_SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          printf '%s  %s\n' "$APK_SHA256" "$APK_NAME" > "$APK_PATH.sha256"
          (
            cd "$OUTPUT_DIR"
            sha256sum --check "$APK_NAME.sha256"
          )
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "sha256_path=$APK_PATH.sha256" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_size=$APK_SIZE" >> "$GITHUB_OUTPUT"
          echo "apk_digest=sha256:$APK_SHA256" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        env:
          APK_PATH: ${{ steps.package_apk.outputs.apk_path }}
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"

      - name: Verify APK identity and TPUI-only manifest
        env:
          ANDROID_VERSION_CODE: ${{ steps.android_version.outputs.code }}
          ANDROID_VERSION_NAME: ${{ steps.android_version.outputs.name }}
          APK_PATH: ${{ steps.package_apk.outputs.apk_path }}
        run: |
          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)"
          test -x "$AAPT2"
          "$AAPT2" dump badging "$APK_PATH" > "$RUNNER_TEMP/pcsx2x6-badging.txt"
          grep -Fq \
            "package: name='com.armsx2' versionCode='$ANDROID_VERSION_CODE' versionName='$ANDROID_VERSION_NAME'" \
            "$RUNNER_TEMP/pcsx2x6-badging.txt"
          grep -Fxq "native-code: 'arm64-v8a'" "$RUNNER_TEMP/pcsx2x6-badging.txt"

          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK_PATH" \
            > "$RUNNER_TEMP/pcsx2x6-manifest.txt"
          grep -Fq '"com.armsx2.Main"' "$RUNNER_TEMP/pcsx2x6-manifest.txt"
          grep -Fq 'excludeFromRecents(0x01010017)=true' \
            "$RUNNER_TEMP/pcsx2x6-manifest.txt"
          grep -Fq '"com.teknoparrot.permission.BIND_BRIDGE"' \
            "$RUNNER_TEMP/pcsx2x6-manifest.txt"
          ! grep -Fq '"android.intent.category.LAUNCHER"' \
            "$RUNNER_TEMP/pcsx2x6-manifest.txt"
          ! grep -Fq '"android.intent.category.GAME"' \
            "$RUNNER_TEMP/pcsx2x6-manifest.txt"
          ! grep -Fq '"android.intent.action.VIEW"' \
            "$RUNNER_TEMP/pcsx2x6-manifest.txt"

      - name: Upload test artifact
        uses: actions/upload-artifact@v7
        with:
          name: pcsx2x6-android-${{ steps.android_version.outputs.code }}-${{ github.sha }}
          path: |
            ${{ steps.package_apk.outputs.apk_path }}
            ${{ steps.package_apk.outputs.sha256_path }}
          if-no-files-found: error

      - name: Remove stale PCSX2X6 module assets
        if: >-
          github.event_name == 'push' &&
          github.repository == 'ReaverTeknoGods/pcsx2x6' &&
          github.ref == 'refs/heads/codex/android-port'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          while IFS= read -r asset; do
            case "$asset" in
              pcsx2x6-*-android-arm64.apk|pcsx2x6-*-android-arm64.apk.sha256)
                gh release delete-asset pcsx2x6 "$asset" --yes
                ;;
            esac
          done < <(
            gh release view pcsx2x6 \
              --json assets --jq '.assets[].name' 2>/dev/null || true
          )

      - name: Publish rolling TPUI module release
        if: >-
          github.event_name == 'push' &&
          github.repository == 'ReaverTeknoGods/pcsx2x6' &&
          github.ref == 'refs/heads/codex/android-port'
        uses: ncipollo/release-action@v1
        with:
          tag: pcsx2x6
          commit: master
          name: ${{ steps.android_version.outputs.name }}
          body: |
            Automated TPUI companion module from commit ${{ github.sha }}.
            This APK has no launcher entry and is installed and launched through TeknoParrotUI.
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: false
          artifacts: "${{ steps.package_apk.outputs.apk_path }},${{ steps.package_apk.outputs.sha256_path }}"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published updater envelope
        if: >-
          github.event_name == 'push' &&
          github.repository == 'ReaverTeknoGods/pcsx2x6' &&
          github.ref == 'refs/heads/codex/android-port'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_NAME: ${{ steps.package_apk.outputs.apk_name }}
          EXPECTED_SIZE: ${{ steps.package_apk.outputs.apk_size }}
          EXPECTED_DIGEST: ${{ steps.package_apk.outputs.apk_digest }}
          EXPECTED_VERSION: ${{ steps.android_version.outputs.name }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/pcsx2x6" \
              > "$RUNNER_TEMP/pcsx2x6-release.json"; then
              break
            fi
            test "$attempt" -lt 5
            sleep 2
          done
          python3 - <<'PY'
          import json
          import os
          from pathlib import PurePosixPath
          from urllib.parse import unquote, urlparse

          with open(
              os.path.join(os.environ["RUNNER_TEMP"], "pcsx2x6-release.json"),
              encoding="utf-8",
          ) as stream:
              release = json.load(stream)

          expected_name = os.environ["EXPECTED_NAME"]
          expected_size = int(os.environ["EXPECTED_SIZE"])
          expected_digest = os.environ["EXPECTED_DIGEST"].lower()
          expected_version = os.environ["EXPECTED_VERSION"]
          if release.get("tag_name") != "pcsx2x6":
              raise SystemExit(f"unexpected release tag: {release.get('tag_name')}")
          if release.get("name") != expected_version:
              raise SystemExit(
                  f"release name mismatch: {release.get('name')} != {expected_version}"
              )

          assets = [
              asset
              for asset in release.get("assets", [])
              if asset.get("name") == expected_name
          ]
          if len(assets) != 1:
              raise SystemExit(
                  f"expected exactly one {expected_name!r} asset, found {len(assets)}"
              )
          asset = assets[0]
          url = asset.get("browser_download_url", "")
          parsed = urlparse(url)
          if parsed.scheme != "https" or not parsed.netloc:
              raise SystemExit(f"asset URL is not authoritative HTTPS: {url!r}")
          if PurePosixPath(unquote(parsed.path)).name != expected_name:
              raise SystemExit(f"asset URL filename mismatch: {url!r}")
          if asset.get("size") != expected_size:
              raise SystemExit(
                  f"asset size mismatch: {asset.get('size')} != {expected_size}"
              )
          if str(asset.get("digest", "")).lower() != expected_digest:
              raise SystemExit(
                  f"asset digest mismatch: {asset.get('digest')} != {expected_digest}"
              )
          if not any(
              item.get("name") == expected_name + ".sha256"
              for item in release.get("assets", [])
          ):
              raise SystemExit("sha256 sidecar is missing from the release")
          print(
              f"verified updater asset {expected_name}: "
              f"size={expected_size} digest={expected_digest}"
          )
          PY
