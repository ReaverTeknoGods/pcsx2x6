# Unified "build everything on every commit" pipeline for the single-core monorepo.
#
# One push to the default branch fans out to every supported target and uploads
# an individual binary artifact per platform:
#   * PC arm64 Qt GUI  -> macOS, Linux, Windows  (reuses the reusable workflows)
#   * Android APK       -> platforms/android  (Gradle + NDK, thin CMake on root core)
#   * iOS .app          -> platforms/ios      (Xcode/CMake on root core)
#
# Windows-on-arm64 builds natively on a Windows 11 arm64 runner (see
# windows_build_qt.yml): a single arm64 deps stage, then the arm64 GUI.
#
# NOTE: The Android and iOS jobs build against the freshly-collapsed single core
# and have not yet had a green run; they are the mechanism that will surface the
# remaining reconciliation work. Keep them non-blocking until they first pass.
#
# INVARIANT (do not weaken): the PC arm64 jobs (pc-macos-arm64 / pc-linux-arm64 /
# pc-windows-arm64) are BLOCKING and must stay so. They are the guardrail that a
# mobile-motivated change has not silently altered the shared canonical core.
# Anything mobile-specific belongs behind a platform guard (#if __ANDROID__ /
# ARMSX2_IOS) or in a forked, CMake-selected translation unit (see the aR5900*
# EE fork in pcsx2/CMakeLists.txt) -- never grafted unguarded into shared files.
name: Build All Platforms

on:
  push:
    # Build every pushed source branch. Per-ref concurrency below cancels an
    # older in-flight run when a newer commit is pushed to the same branch, so
    # the surviving artifact always corresponds to that branch's latest SHA.
    # Doc-only pushes shouldn't burn ~2h of arm64 CI.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE*'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'LICENSE*'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: build-all-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- PC arm64 Qt GUI (mac / linux) -------------------------------------
  pc-macos-arm64:
    name: PC · macOS arm64 (Qt)
    uses: ./.github/workflows/macos_build.yml
    with:
      jobName: "macOS arm64"
      artifactPrefixName: "armsx2-macos-arm64"
      sign_and_notarize: true
    secrets: inherit

  pc-linux-arm64:
    name: PC · Linux arm64 (Qt)
    strategy:
      fail-fast: false
      matrix:
        include:
          # The GitHub aarch64 runners use 4K pages, so an unqualified build only
          # runs on 4K-page kernels. 16K-page kernels (e.g. Asahi Linux on Apple
          # Silicon) need a separate binary, so build both variants explicitly
          # instead of quietly inheriting the runner's page size.
          - pageVariant: "4k"
            pageSize: "4096"
            cacheLineSize: "64"
          - pageVariant: "16k"
            pageSize: "16384"
            cacheLineSize: "128"
    uses: ./.github/workflows/linux_build_qt.yml
    with:
      jobName: "Linux arm64 (${{ matrix.pageVariant }} pages)"
      artifactPrefixName: "armsx2-linux-arm64-${{ matrix.pageVariant }}-appimage"
      compiler: clang
      cmakeflags: "-DHOST_PAGE_SIZE=${{ matrix.pageSize }} -DHOST_CACHE_LINE_SIZE=${{ matrix.cacheLineSize }}"
      buildAppImage: true

  # ---- libretro core (linux arm64) ---------------------------------------
  pc-linux-arm64-libretro:
    name: PC · Linux arm64 (libretro core)
    uses: ./.github/workflows/linux_build_libretro.yml
    with:
      jobName: "libretro Core Build (arm64)"
      artifactPrefixName: "armsx2-linux-arm64-libretro"
      fetchTags: true
    secrets: inherit

  # ---- SDL/kmsdrm handheld frontend (linux arm64) ------------------------
  pc-linux-arm64-sdl:
    name: PC · Linux arm64 (SDL kmsdrm)
    uses: ./.github/workflows/linux_build_sdl.yml
    with:
      jobName: "SDL Handheld Build (arm64)"
      artifactPrefixName: "armsx2-linux-arm64-sdl"
      fetchTags: true
    secrets: inherit

  # ---- PC arm64 Qt GUI (windows) -----------------------------------------
  pc-windows-arm64:
    name: PC · Windows arm64 (Qt)
    uses: ./.github/workflows/windows_build_qt.yml
    with:
      jobName: "Windows arm64"
      artifactPrefixName: "armsx2-windows-arm64"

  # ---- Android APK -------------------------------------------------------
  android:
    name: Android APK
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: platforms/android
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Confirm event source
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$GITHUB_SHA"
          echo "Building source $ACTUAL_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # NDK matches the version AGP resolves to (build.gradle.kts pins none, so it
      # uses AGP's default 28.2.13676358); cmake 3.31.6 matches the pin in
      # build.gradle.kts. 3.22.1 (AGP's default) is the shaderc deps' exact
      # cmake_minimum_required floor and fails to configure spirv-tools.
      - name: Install NDK + CMake
        run: yes | sdkmanager "ndk;28.2.13676358" "cmake;3.31.6" >/dev/null || true

      # shaderc's SPIRV-Tools/glslang/etc. are fetched on demand (not vendored,
      # not submodules), so `submodules: recursive` above does not provide them.
      - name: Fetch shaderc third-party deps
        run: python3 app/src/main/cpp/3rdparty/shaderc/utils/git-sync-deps

      # librashader is built by cargo for the Android target; the runner's
      # rustup only ships the host std, so the cargo step dies with
      # "error[E0463]: can't find crate for `core`" without this.
      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android

      # Only pushes to the dedicated ARMSX2-based Android release branch may
      # use the production key. The PCSX2X6 master branch remains independent,
      # and PR/other-branch artifacts stay debug-signed test builds.
      - name: Configure TeknoParrot production signing
        if: >-
          github.event_name == 'push' &&
          github.repository == 'ReaverTeknoGods/pcsx2x6' &&
          github.ref == 'refs/heads/codex/android-port'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/teknoparrot-release.keystore"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/teknoparrot-release.keystore" \
            "$STORE_PASSWORD" \
            "$KEY_ALIAS" \
            "$KEY_PASSWORD" \
            > armsx2_keystore.properties

      - name: Generate Android build version
        id: android_version
        run: |
          # Both Android and TPUI compare this monotonic timestamp-derived
          # version. Keep versionName in TPUI's numeric A.B.C.build format.
          VERSION_CODE="$(( $(date -u +%s) - 1700000000 ))"
          BASE_VERSION="$(sed -n 's/.*versionName.*?:[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          printf '%s\n' "$BASE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          VERSION_NAME="${BASE_VERSION}.${VERSION_CODE}"
          test "$VERSION_CODE" -gt 1000000
          test "$VERSION_CODE" -le 2147483647
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Android versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      - name: Build latest-source GitHub APK
        env:
          ANDROID_VERSION_CODE: ${{ steps.android_version.outputs.code }}
          ANDROID_VERSION_NAME: ${{ steps.android_version.outputs.name }}
        run: |
          ./gradlew :app:assembleGithubRelease --stacktrace \
            -Parmsx2.versionCode="$ANDROID_VERSION_CODE" \
            -Parmsx2.versionName="$ANDROID_VERSION_NAME"

      - name: Verify generated APK metadata
        env:
          ANDROID_VERSION_CODE: ${{ steps.android_version.outputs.code }}
          ANDROID_VERSION_NAME: ${{ steps.android_version.outputs.name }}
        run: |
          python3 - <<'PY'
          import glob
          import json
          import os
          from pathlib import Path

          paths = glob.glob("app/build/outputs/apk/github/release/output-metadata.json")
          if len(paths) != 1:
              raise SystemExit(f"expected one output-metadata.json, found {paths}")

          metadata_path = Path(paths[0]).resolve()
          with metadata_path.open(encoding="utf-8") as stream:
              metadata = json.load(stream)
          if metadata.get("applicationId") != "com.armsx2":
              raise SystemExit(
                  f"applicationId mismatch: {metadata.get('applicationId')} != com.armsx2"
              )
          if metadata.get("variantName") != "githubRelease":
              raise SystemExit(
                  f"variant mismatch: {metadata.get('variantName')} != githubRelease"
              )
          elements = metadata.get("elements", [])
          if len(elements) != 1:
              raise SystemExit(f"expected one GitHub APK element, found {len(elements)}")

          element = elements[0]
          expected_code = int(os.environ["ANDROID_VERSION_CODE"])
          expected_name = os.environ["ANDROID_VERSION_NAME"]
          if element.get("versionCode") != expected_code:
              raise SystemExit(
                  f"versionCode mismatch: {element.get('versionCode')} != {expected_code}"
              )
          if element.get("versionName") != expected_name:
              raise SystemExit(
                  f"versionName mismatch: {element.get('versionName')} != {expected_name}"
              )
          output_file = element.get("outputFile", "")
          if not output_file or Path(output_file).name != output_file:
              raise SystemExit(f"unsafe or missing outputFile: {output_file!r}")
          output_path = metadata_path.parent / output_file
          if not output_path.is_file():
              raise SystemExit(f"metadata APK does not exist: {output_path}")
          apk_files = sorted(metadata_path.parent.glob("*.apk"))
          if apk_files != [output_path]:
              raise SystemExit(
                  f"expected metadata to identify the only APK, found {apk_files}"
              )
          print(
              "verified applicationId=com.armsx2 "
              f"variant=githubRelease versionName={expected_name} "
              f"versionCode={expected_code} outputFile={output_file}"
          )
          PY

      - name: Stage updater APK
        id: package_apk
        env:
          ANDROID_VERSION_NAME: ${{ steps.android_version.outputs.name }}
        run: |
          mapfile -t APK_FILES < <(find app/build/outputs/apk/github/release -maxdepth 1 -type f -name '*.apk')
          test "${#APK_FILES[@]}" -eq 1
          OUTPUT_DIR="$GITHUB_WORKSPACE/out/pcsx2x6-android"
          APK_PATH="$OUTPUT_DIR/pcsx2x6-${ANDROID_VERSION_NAME}-android-arm64.apk"
          mkdir -p "$OUTPUT_DIR"
          cp "${APK_FILES[0]}" "$APK_PATH"
          APK_NAME="$(basename "$APK_PATH")"
          APK_SIZE="$(stat -c '%s' "$APK_PATH")"
          APK_SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          printf '%s  %s\n' "$APK_SHA256" "$APK_NAME" > "$APK_PATH.sha256"
          (
            cd "$OUTPUT_DIR"
            sha256sum --check "$APK_NAME.sha256"
          )
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "sha256_path=$APK_PATH.sha256" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_size=$APK_SIZE" >> "$GITHUB_OUTPUT"
          echo "apk_digest=sha256:$APK_SHA256" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        env:
          APK_PATH: ${{ steps.package_apk.outputs.apk_path }}
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"

      - name: Verify APK identity and TPUI-only manifest
        env:
          ANDROID_VERSION_CODE: ${{ steps.android_version.outputs.code }}
          ANDROID_VERSION_NAME: ${{ steps.android_version.outputs.name }}
          APK_PATH: ${{ steps.package_apk.outputs.apk_path }}
        run: |
          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)"
          test -x "$AAPT2"
          "$AAPT2" dump badging "$APK_PATH" > "$RUNNER_TEMP/pcsx2x6-badging.txt"
          grep -Fq \
            "package: name='com.armsx2' versionCode='$ANDROID_VERSION_CODE' versionName='$ANDROID_VERSION_NAME'" \
            "$RUNNER_TEMP/pcsx2x6-badging.txt"
          grep -Fxq "native-code: 'arm64-v8a'" "$RUNNER_TEMP/pcsx2x6-badging.txt"

          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK_PATH" \
            > "$RUNNER_TEMP/pcsx2x6-manifest.txt"
          grep -Fq '"com.armsx2.Main"' "$RUNNER_TEMP/pcsx2x6-manifest.txt"
          grep -Fq 'excludeFromRecents(0x01010017)=true' \
            "$RUNNER_TEMP/pcsx2x6-manifest.txt"
          grep -Fq '"com.teknoparrot.permission.BIND_BRIDGE"' \
            "$RUNNER_TEMP/pcsx2x6-manifest.txt"
          ! grep -Fq '"android.intent.category.LAUNCHER"' \
            "$RUNNER_TEMP/pcsx2x6-manifest.txt"
          ! grep -Fq '"android.intent.category.GAME"' \
            "$RUNNER_TEMP/pcsx2x6-manifest.txt"
          ! grep -Fq '"android.intent.action.VIEW"' \
            "$RUNNER_TEMP/pcsx2x6-manifest.txt"

      - name: Upload test artifact
        uses: actions/upload-artifact@v7
        with:
          name: pcsx2x6-android-${{ steps.android_version.outputs.code }}-${{ github.sha }}
          path: |
            ${{ steps.package_apk.outputs.apk_path }}
            ${{ steps.package_apk.outputs.sha256_path }}
          if-no-files-found: error

      - name: Move rolling release tag to this source
        if: >-
          github.event_name == 'push' &&
          github.repository == 'ReaverTeknoGods/pcsx2x6' &&
          github.ref == 'refs/heads/codex/android-port'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/pcsx2x6" >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/pcsx2x6" \
              -f sha="$GITHUB_SHA" \
              -F force=true
          else
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref='refs/tags/pcsx2x6' \
              -f sha="$GITHUB_SHA"
          fi

      - name: Remove stale PCSX2X6 module assets
        if: >-
          github.event_name == 'push' &&
          github.repository == 'ReaverTeknoGods/pcsx2x6' &&
          github.ref == 'refs/heads/codex/android-port'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          while IFS= read -r asset; do
            case "$asset" in
              pcsx2x6-*-android-arm64.apk|pcsx2x6-*-android-arm64.apk.sha256)
                gh release delete-asset pcsx2x6 "$asset" --yes
                ;;
            esac
          done < <(
            gh release view pcsx2x6 \
              --json assets --jq '.assets[].name' 2>/dev/null || true
          )

      - name: Publish rolling TPUI module release
        if: >-
          github.event_name == 'push' &&
          github.repository == 'ReaverTeknoGods/pcsx2x6' &&
          github.ref == 'refs/heads/codex/android-port'
        uses: ncipollo/release-action@v1
        with:
          tag: pcsx2x6
          name: ${{ steps.android_version.outputs.name }}
          body: |
            Automated TPUI companion module from commit ${{ github.sha }}.
            This APK has no launcher entry and is installed and launched through TeknoParrotUI.
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: false
          artifacts: "${{ steps.package_apk.outputs.apk_path }},${{ steps.package_apk.outputs.sha256_path }}"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published updater envelope
        if: >-
          github.event_name == 'push' &&
          github.repository == 'ReaverTeknoGods/pcsx2x6' &&
          github.ref == 'refs/heads/codex/android-port'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_NAME: ${{ steps.package_apk.outputs.apk_name }}
          EXPECTED_SIZE: ${{ steps.package_apk.outputs.apk_size }}
          EXPECTED_DIGEST: ${{ steps.package_apk.outputs.apk_digest }}
          EXPECTED_VERSION: ${{ steps.android_version.outputs.name }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/pcsx2x6" \
              > "$RUNNER_TEMP/pcsx2x6-release.json"; then
              break
            fi
            test "$attempt" -lt 5
            sleep 2
          done
          python3 - <<'PY'
          import json
          import os
          from pathlib import PurePosixPath
          from urllib.parse import unquote, urlparse

          with open(
              os.path.join(os.environ["RUNNER_TEMP"], "pcsx2x6-release.json"),
              encoding="utf-8",
          ) as stream:
              release = json.load(stream)

          expected_name = os.environ["EXPECTED_NAME"]
          expected_size = int(os.environ["EXPECTED_SIZE"])
          expected_digest = os.environ["EXPECTED_DIGEST"].lower()
          expected_version = os.environ["EXPECTED_VERSION"]
          if release.get("tag_name") != "pcsx2x6":
              raise SystemExit(f"unexpected release tag: {release.get('tag_name')}")
          if release.get("name") != expected_version:
              raise SystemExit(
                  f"release name mismatch: {release.get('name')} != {expected_version}"
              )

          assets = [
              asset
              for asset in release.get("assets", [])
              if asset.get("name") == expected_name
          ]
          if len(assets) != 1:
              raise SystemExit(
                  f"expected exactly one {expected_name!r} asset, found {len(assets)}"
              )
          asset = assets[0]
          url = asset.get("browser_download_url", "")
          parsed = urlparse(url)
          if parsed.scheme != "https" or not parsed.netloc:
              raise SystemExit(f"asset URL is not authoritative HTTPS: {url!r}")
          if PurePosixPath(unquote(parsed.path)).name != expected_name:
              raise SystemExit(f"asset URL filename mismatch: {url!r}")
          if asset.get("size") != expected_size:
              raise SystemExit(
                  f"asset size mismatch: {asset.get('size')} != {expected_size}"
              )
          if str(asset.get("digest", "")).lower() != expected_digest:
              raise SystemExit(
                  f"asset digest mismatch: {asset.get('digest')} != {expected_digest}"
              )
          if not any(
              item.get("name") == expected_name + ".sha256"
              for item in release.get("assets", [])
          ):
              raise SystemExit("sha256 sidecar is missing from the release")
          print(
              f"verified updater asset {expected_name}: "
              f"size={expected_size} digest={expected_digest}"
          )
          PY

  # ---- iOS .app ----------------------------------------------------------
  ios:
    name: iOS (arm64, unsigned device IPA)
    runs-on: macos-26
    # Non-blocking until the collapsed-core iOS build first goes green.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Configure (CMake, Xcode generator, real device SDK, no signing)
        working-directory: platforms/ios/app/src/main/cpp
        run: >
          cmake -G Xcode -B build
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DARMSX2_REAL_DEVICE=ON

      - name: Build (iphoneos SDK, unsigned)
        working-directory: platforms/ios/app/src/main/cpp
        run: >
          cmake --build build --config Release
          -- -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned .ipa
        working-directory: platforms/ios/app/src/main/cpp
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          IPA_NAME="ARMSX2-iOS-${SHORT_SHA}.ipa"

          APP_PATH=$(find build -name "ARMSX2iOS.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: ARMSX2iOS.app not found in build output"
            exit 1
          fi

          echo "Found app at: $APP_PATH"
          echo "Packaging as: $IPA_NAME"

          STAGING=$(mktemp -d)
          mkdir -p "$STAGING/Payload"
          cp -R "$APP_PATH" "$STAGING/Payload/"

          cd "$STAGING"
          zip -r "$GITHUB_WORKSPACE/$IPA_NAME" Payload -x "*.DS_Store"
          cd "$GITHUB_WORKSPACE"

          echo "IPA_NAME=$IPA_NAME" >> $GITHUB_ENV
          ls -lh "$IPA_NAME"

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: ${{ github.workspace }}/${{ env.IPA_NAME }}
          if-no-files-found: error

  # ---- Alert on a broken master build ------------------------------------
  # Fires only when a BLOCKING guardrail job (the PC arm64 builds) fails on a
  # push to master -- never on PRs, and never on the non-blocking mobile jobs
  # (they are continue-on-error, so they can't trip `failure()`). GitHub also
  # emails the pusher natively; this adds a Discord ping to the shared channel.
  notify-failure:
    name: Notify on master build failure
    needs: [pc-macos-arm64, pc-linux-arm64, pc-windows-arm64]
    if: ${{ failure() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    # Job-level so the step's `if: env.HOOK != ''` guard can see it.
    env:
      HOOK: ${{ secrets.DISCORD_BUILD_WEBHOOK }}
    steps:
      - name: Discord failure ping
        if: ${{ env.HOOK != '' }}   # no-op on forks that lack the secret
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n \
            --arg url "$RUN_URL" \
            --arg desc "Commit \`${{ github.sha }}\` by ${{ github.actor }} failed a required build." \
            '{username:"ARMSX2 CI", embeds:[{title:"❌ master build broke", url:$url, color:15158332, description:$desc}]}' \
          | curl -fsSL -H 'Content-Type: application/json' -d @- "$HOOK"
